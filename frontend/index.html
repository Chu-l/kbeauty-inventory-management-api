<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./style.css" />

    <title>K-Beauty Inventory Manager</title>

    <link
      rel="icon"
      href="https://img.magnific.com/free-vector/floral-k-letter-font-romantic-typography_53876-116758.jpg"
    />
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav class="navbar">
        <div class="logo-container">
          <img
            src="https://img.magnific.com/free-vector/floral-k-letter-font-romantic-typography_53876-116758.jpg"
            alt="K-Beauty Inventory Manager Logo"
            id="logo"
          />

          <div>
            <h1>K-Beauty Inventory Manager</h1>
            <span>Inventory Dashboard</span>
          </div>
        </div>

        <div id="logged-user" class="user-actions">
          <div class="user-info">
            <span>Hi,</span>
            <strong id="user-email"></strong>
          </div>
        
          <button id="logout" class="btn-secondary">Log Out</button>
        </div>

        <div id="guest-buttons" class="nav-buttons">
          <a href="./pages/login.html">
            <button class="btn-secondary">Log In</button>
          </a>

          <a href="./pages/register.html">
            <button class="btn-primary">Register</button>
          </a>
        </div>
      </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
      <h2>Manage your K-Beauty inventory with ease</h2>

      <p>
        Track products, monitor stock levels and keep your inventory organized.
      </p>
    </section>

    <!-- Dashboard -->
    <section class="stats">

      <div class="stat-card">
        <h3 id="total-products">0</h3>
        <p>Products</p>
      </div>

      <div class="stat-card">
        <h3 id="low-stock">0</h3>
        <p>Low Stock</p>
      </div>

      <div class="stat-card">
        <h3 id="inventory-value">$0</h3>
        <p>Total Value</p>
      </div>

    </section>

    <!-- Products -->
    <main>

      <div id="admin-actions" class="admin-actions">
      <button id="add-product" class="btn-primary">+ Add Product</button>
      </div>

      <form id="product-form" class="product-form">
        <h2 id="product-form-title">Add Product</h2>
      
        <div class="input-container">
          <label for="product-name">Name</label>
          <input type="text" id="product-name" placeholder="Product name" required />
        </div>
      
        <div class="input-container">
          <label for="product-description">Description</label>
          <input type="text" id="product-description" placeholder="Product description" required />
        </div>
      
        <div class="input-container">
          <label for="product-price">Price</label>
          <input type="number" id="product-price" placeholder="25000" min="0" required />
        </div>
      
        <div class="input-container">
          <label for="product-stock">Stock</label>
          <input type="number" id="product-stock" placeholder="10" min="0" required />
        </div>
      
        <div class="form-buttons">
          <button type="submit" class="btn-primary" id="product-form-submit">
            Add Product
          </button>
      
          <button type="button" id="cancel-product" class="btn-secondary">
            Cancel
          </button>
        </div>
      </form>

      <section id="product-list" class="products-grid"></section>

    </main>

    <script src="./app.js"></script>
  </body>
</html>
