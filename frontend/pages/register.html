<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../style.css" />

    <title>Register</title>

    <link
      rel="icon"
      href="https://img.magnific.com/free-vector/floral-k-letter-font-romantic-typography_53876-116758.jpg"
    />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="logo-container">
          <a href="../index.html">
            <img
              id="logo"
              src="https://img.magnific.com/free-vector/floral-k-letter-font-romantic-typography_53876-116758.jpg"
              alt="K-Beauty Inventory Manager Logo"
            />
          </a>

          <div>
            <h1>K-Beauty Inventory Manager</h1>
            <span>Inventory Dashboard</span>
          </div>
        </div>

        <div class="nav-buttons">
          <a href="./login.html">
            <button class="btn-secondary">Log In</button>
          </a>
        </div>
      </nav>
    </header>

    <main class="auth-page">
      <div class="auth-card">

        <h2>Create Account</h2>

        <p>Create your account to manage your inventory.</p>

        <form id="register-form">

          <div class="input-group">
            <label for="email">Email</label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="input-group">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              placeholder="Choose a password"
              required
            />
          </div>

          <button class="btn-primary auth-button">
            Register
          </button>

        </form>

        <p class="auth-link">
          Already have an account?

          <a href="./login.html">
            Log In
          </a>
        </p>

      </div>
    </main>

    <script src="./register.js"></script>
  </body>
</html>
